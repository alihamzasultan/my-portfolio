<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AHS monogram">
  <!-- Neobrutalist monogram: hard offset shadow, thick black keyline, yellow face -->
  <rect x="10" y="10" width="50" height="50" fill="#111111"/>
  <rect x="4" y="4" width="50" height="50" fill="#ffd23f" stroke="#111111" stroke-width="4"/>
  <!-- Letter A -->
  <path d="M17 42 L29 15 L36 15 L48 42 L40.5 42 L38.2 36.5 L26.8 36.5 L24.5 42 Z M29.2 30.5 L35.8 30.5 L32.5 22.6 Z"
        fill="#111111"/>
  <!-- Underscore accent, echoing the site's terminal styling -->
  <rect x="20" y="45.5" width="18" height="3.5" fill="#111111"/>
</svg>
